name: Studio CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q studio scripts tests
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Check dashboard files
        run: test -s web/index.html && test -s README.md
